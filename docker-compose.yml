version: '3.8'

services:
  ios-mac-beta-bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ios_mac_beta_bot
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "python3 -c 'import sqlite3; conn = sqlite3.connect(\"/app/data/releases.db\"); conn.close()' || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 20s
